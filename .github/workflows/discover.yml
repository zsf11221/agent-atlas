name: Discover ecosystem projects
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-atlas-discovery
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover GitHub agent projects
        id: discover
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover.py
      - name: Publish data and pipeline status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/pipeline_status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh source-led agent project discovery"
            git push
          fi
      - name: Report failed source checks
        if: steps.discover.outcome == 'failure'
        run: |
          echo "Discovery failed; consult data/pipeline_status.json" >> "$GITHUB_STEP_SUMMARY"
          exit 1
