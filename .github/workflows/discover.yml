name: Discover ecosystem projects
on:
  push:
    branches: [main]
    paths:
      - 'scripts/discover.py'
      - 'scripts/discover_external.py'
      - 'scripts/build_catalog.py'
      - '.github/workflows/discover.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-atlas-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover GitHub agent projects
        id: discover
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover.py
      - name: Validate discovery scripts
        run: python -m py_compile scripts/discover.py scripts/discover_external.py
      - name: Discover DEX Screener and BNB Chain ecosystem leads
        id: external
        continue-on-error: true
        run: python scripts/discover_external.py
      - name: Validate and build consolidated project catalog (no external API)
        run: |
          python -m py_compile scripts/build_catalog.py
          python scripts/build_catalog.py --self-test
          python scripts/build_catalog.py
      - name: Publish data and pipeline status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/pipeline_status.json data/external_projects.json data/catalog.json data/review_queue.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh source-led agent project discovery"
            published=0
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin main; then
                published=1
                break
              fi
              # Never force-push, and never override concurrent data changes.
              if test -d .git/rebase-merge || test -d .git/rebase-apply; then
                git rebase --abort || true
                echo "Conflicting upstream data: leaving the original untouched for next scheduled refresh."
                exit 1
              fi
              sleep "$attempt"
            done
            test "$published" -eq 1
          fi
      - name: Report unavailable external sources
        if: steps.external.outcome == 'failure'
        run: echo "External discovery sources unavailable; previous records retained" >> "$GITHUB_STEP_SUMMARY"
      - name: Report failed source checks
        if: steps.discover.outcome == 'failure'
        run: |
          echo "Discovery failed; consult data/pipeline_status.json" >> "$GITHUB_STEP_SUMMARY"
          exit 1
