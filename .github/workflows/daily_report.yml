name: Daily brief (22:00 Beijing)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/daily_report.py'
      - '.github/workflows/daily_report.yml'
  schedule:
    # 22:00 Beijing (UTC+8) daily = 14:00 UTC. Runs after the 20:00 Beijing
    # X discovery run so the brief covers the full day's leads.
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-atlas-daily-report
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and build the daily brief (no secrets, no paid API)
        run: |
          python -m py_compile scripts/daily_report.py
          python scripts/daily_report.py --self-test
          python scripts/daily_report.py
      - name: Publish daily brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily
          if ! git diff --cached --quiet; then
            git commit -m "data: daily brief"
            published=0
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin main; then
                published=1
                break
              fi
              # Never force-push, and never override concurrent data changes.
              if test -d .git/rebase-merge || test -d .git/rebase-apply; then
                git rebase --abort || true
                echo "Conflicting upstream data: leaving the original untouched for next scheduled run."
                exit 1
              fi
              sleep "$attempt"
            done
            test "$published" -eq 1
          fi
