name: Deploy BSC chain Worker (opt-in)

on:
  workflow_dispatch:
  push:
    paths:
      - 'chain-worker/**'
      - '.github/workflows/deploy-chain-worker.yml'

permissions:
  contents: read

concurrency:
  group: agent-atlas-chain-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.ENABLE_CHAIN_DEPLOY == 'true' && vars.CHAIN_D1_DATABASE_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: chain-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
      CHAIN_D1_DATABASE_ID: ${{ vars.CHAIN_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify setup and credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$BSC_RPC_URL"
          node -e "if (!/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(process.env.CHAIN_D1_DATABASE_ID || '')) throw Error('D1 UUID missing or malformed')"
      - name: Install Wrangler and run offline tests
        run: |
          npm install --no-audit --no-fund
          node --test
      - name: Bind existing D1 database for deployment (never commit the UUID)
        run: |
          node -e "const fs=require('node:fs');const f='wrangler.jsonc';let s=fs.readFileSync(f,'utf8');if(!s.includes('REPLACE_WITH_YOUR_D1_DATABASE_UUID'))throw Error('Missing config placeholder');fs.writeFileSync(f,s.replace('REPLACE_WITH_YOUR_D1_DATABASE_UUID',process.env.CHAIN_D1_DATABASE_ID))"
      - name: Apply schema migrations
        run: npx wrangler d1 migrations apply agent-atlas-chain --remote
      - name: Deploy Worker and 5-minute cron
        run: npx wrangler deploy
      - name: Set private RPC secret
        run: printf '%s' "$BSC_RPC_URL" | npx wrangler secret put BSC_RPC_URL
